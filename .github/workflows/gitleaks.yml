name: Gitleaks

# Invocado por CI en cada PR, push a main y ejecución manual.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks · secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks 8.30.1 y verificar integridad
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Escanear commits de la PR o historial completo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-results"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          else
            log_opts="--all --full-history"
          fi
          gitleaks git . --log-opts="$log_opts" \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --ignore-gitleaks-allow --redact=100 --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-results/findings.json"

      - name: Conservar reporte con secretos ocultos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-results/findings.json
          if-no-files-found: error
          retention-days: 7
