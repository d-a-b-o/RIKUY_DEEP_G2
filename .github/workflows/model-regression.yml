name: HU22 model regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      degraded:
        description: 'RIKDP-145: usar copia degradada; el job real debe FALLAR'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression-contract:
    name: HU22 synthetic contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r ml/requirements-ci.txt
      - run: python -m pytest -c ml/pytest.ini ml/tests/test_regression.py ml/tests/test_regression_data.py --junitxml=reports/regression-unit.xml
      - name: Reconstruct DVC synthetic fixtures (no remote required)
        run: |
          python -m ml.golden --output golden/synthetic
          dvc add golden/synthetic
          git diff --exit-code -- golden/synthetic.dvc
          dvc checkout golden/synthetic.dvc
          python -c "from ml.regression import validate_golden; validate_golden('golden/synthetic')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hu22-contract-evidence
          path: reports/
          retention-days: 14

  model-regression:
    name: HU22 real model gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      TF_ENABLE_ONEDNN_OPTS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # numpy 2.5 exige Python >= 3.12; 3.12 es también la versión de Colab.
          python-version: '3.12'
      - run: pip install -r ml/requirements-regression.txt
      - name: PT1 RIKDP-84 · Contrato real de entrada TensorFlow
        env:
          PT1_REQUIRE_TENSORFLOW: '1'
        run: >-
          python -m pytest -c ml/pytest.ini
          ml/tests/test_preprocessing.py ml/tests/test_preprocessing_tensorflow.py
          --junitxml=reports/preprocessing/RIKDP-84.xml
      - name: PT1 RIKDP-84 · Evidencia del preprocesamiento
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pt1-preprocessing-evidence
          path: reports/preprocessing/
          retention-days: 14
          if-no-files-found: error
      - name: Retrieve public Drive objects, verify hashes and pull with DVC
        run: python -m ml.regression_data
      - name: Prepare deliberately degraded copy (manual negative control)
        if: github.event_name == 'workflow_dispatch' && inputs.degraded
        run: python -m ml.regression_negative --prepare-only --output reports/pt1-negative
      - name: Compare baseline and candidate (0-2 pass; 3+ fail)
        if: github.event_name != 'workflow_dispatch' || !inputs.degraded
        run: python -m ml.regression
      - name: RIKDP-145 real degraded model must fail this job
        if: github.event_name == 'workflow_dispatch' && inputs.degraded
        shell: bash
        run: |
          set +e
          python -m ml.regression --config reports/pt1-negative/config.json
          result=$?
          echo "$result" > reports/pt1-negative/gate-exit-code.txt
          exit "$result"
      - name: Verify that failure was caused by real prediction differences
        if: always() && github.event_name == 'workflow_dispatch' && inputs.degraded
        run: >-
          python -c "from pathlib import Path; from ml.workflow import read_json;
          from ml.regression import write_json; from ml.regression_negative import verify_rejection;
          code=int(Path('reports/pt1-negative/gate-exit-code.txt').read_text());
          report=read_json('reports/regression/regression.json');
          valid=verify_rejection(code,report);
          write_json('reports/pt1-negative/verification.json',dict(passed=valid,gate_exit_code=code));
          assert valid, 'No se acredito el rechazo del modelo degradado'"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hu22-real-regression-evidence
          path: |
            reports/regression/
            reports/pt1-negative/provenance.json
            reports/pt1-negative/gate-exit-code.txt
            reports/pt1-negative/verification.json
          retention-days: 14
          if-no-files-found: error
