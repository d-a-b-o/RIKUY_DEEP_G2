name: HU51 SBOM
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  web:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Instalar generador sin ejecutar scripts de paquetes
        run: npm ci --ignore-scripts --legacy-peer-deps=false --no-audit --no-fund
        working-directory: apps/web
      - name: Generar y validar inventario completo
        run: npm run sbom
        working-directory: apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-web-${{ github.event.workflow_run.head_sha }}
          path: apps/web/sbom-web.cdx.json*
          if-no-files-found: error
          retention-days: 90
  ml:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [ci, publish, regression, train]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Resolver el entorno real, separado del generador
        env:
          REQUIREMENTS: ml/requirements-${{ matrix.environment }}.txt
        run: |
          python -m venv /tmp/sbom-target
          /tmp/sbom-target/bin/python -m pip install -r "$REQUIREMENTS"
          python -m pip install -r .github/requirements-sbom.txt
          /tmp/sbom-target/bin/python -m pip freeze > resolved-requirements.txt
          cyclonedx-py environment /tmp/sbom-target/bin/python --output-format JSON --output-file sbom-ml.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-ml-${{ matrix.environment }}-${{ github.event.workflow_run.head_sha }}
          path: |
            sbom-ml.cdx.json
            resolved-requirements.txt
          if-no-files-found: error
          retention-days: 90
